def groupName = 'org.nrg'
def artifactName = 'grxnat'
def buildVersion = '1.17.1'

group groupName
version buildVersion

apply plugin: 'groovy'
apply plugin: 'java'
apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'io.spring.dependency-management'

def vBom = '3.0'
def vTestUtils = '2.4'

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath "io.spring.gradle:dependency-management-plugin:1.0.3.RELEASE"
    }
}

dependencyManagement {
    imports {
        mavenBom "org.nrg:test_dependencies:${vBom}"
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    jcenter()
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release' }
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot' }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

configurations {
     compile.extendsFrom(compileAndInclude)
}

dependencies {
    compile('org.codehaus.groovy:groovy-all')
    compileAndInclude('org.apache.commons:commons-lang3')
    compileAndInclude('commons-io:commons-io')
    compileAndInclude('com.fasterxml.jackson.core:jackson-annotations')
    compileAndInclude('com.fasterxml.jackson.core:jackson-core')
    compileAndInclude('com.fasterxml.jackson.core:jackson-databind')
    compileAndInclude('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml')
    compileAndInclude('com.fasterxml.jackson.datatype:jackson-datatype-hibernate4')
    compileAndInclude('org.hibernate:hibernate-core')
    compileAndInclude('org.reflections:reflections')
    compileAndInclude('com.jayway.restassured:rest-assured') {
        exclude(group: 'org.codehaus.groovy', module: '*')
    }
    compileAndInclude('org.slf4j:slf4j-log4j12')
    compileAndInclude("org.nrg:test_utils:${vTestUtils}")
    compileAndInclude('org.codehaus.gpars:gpars')
    compileAndInclude('org.dcm4che.tool:dcm4che-tool-storescu')

    testCompile 'org.testng:testng'
}

test {
    useTestNG {}
}

jar {
    from sourceSets.main.allSource
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId groupName
            artifactId artifactName
            version buildVersion

            from components.java

            pom.withXml {
                def root = asNode()
                root.appendNode('name', 'grxnat')
                root.appendNode('url', 'https://bitbucket.org/xnatdev/grxnat')
                root.appendNode('inceptionYear', '2017')

                def scm = root.appendNode('scm')
                scm.appendNode('url', 'https://bitbucket.org/xnatdev/grxnat')
                scm.appendNode('connection', 'https://bitbucket.org/xnatdev/grxnat')
                scm.appendNode('developerConnection', 'scm:git://bitbucket.org/xnatdev/grxnat.git')

                def developers = root.appendNode('developers')

                def charlie = developers.appendNode('developer')
                charlie.appendNode('id', 'grepStar')
                charlie.appendNode('name', 'Charlie Moore')
                charlie.appendNode('email', 'moore.c@wustl.edu')
            }
        }
    }
    repositories {
        maven {
            credentials {
                // These properties must be set in the ~/.gradle/gradle.properties file or passed on the Gradle command
                // line in the form -PrepoUsername=foo -PrepoPassword=bar.
                username propertyWithDefault('repoUsername', 'username')
                password propertyWithDefault('repoPassword', 'password')
            }
            if (project.version.endsWith('-SNAPSHOT')) {
                url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local'
            } else {
                url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release-local'
            }
        }
    }
}

task fatJar(type: Jar) {
    zip64 true
    classifier = 'fat'
    from {
        configurations.compileAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    with jar
}

def propertyWithDefault(String property, Object value) {
    hasProperty(property) ? getProperty(property) : value
}

defaultTasks 'clean', 'jar', 'test', 'publishMavenJavaPublicationToMavenRepository', 'publishToMavenLocal'
